name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks against the new base. A
    # base-branch change has no activity type of its own; GitHub reports it as `edited`, and `edited`
    # is not one of the default types, so such a pull request otherwise sits with no checks at all.
    #
    # `edited` also fires for title and description edits, so the whole suite re-runs for those too.
    # That cost is accepted deliberately. Skipping the jobs instead — via a `changes.base` guard —
    # does not work: a skipped caller job never produces the `<job> / <job>` context the required
    # status checks are waiting for, and GitHub evaluates requirements against the latest run, so an
    # earlier run's success does not carry over. The pull request ends up blocked on
    # "Expected — Waiting for status to be reported" until someone pushes a commit.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:

  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@d8c49368481b9270bc9e089b61731dc9b9561be8
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@d8c49368481b9270bc9e089b61731dc9b9561be8
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  sindri-phpunit:
    name: Sindri PHPUnit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/sindri-phpunit/**'
              - '.github/workflows/ci.yml'
              - 'app/src/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'
          ini-values: zend.assertions=1

      # Installs the framework and sindri (root require-dev) and, via the root
      # `post-install-cmd` hook, copies the *.example.php stubs into place. The
      # generation step below then overwrites those stubs with the real classes.
      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Generate the data cache with sindri
        if: steps.changes.outputs.files == 'true'
        run: composer sindri-generate

      - name: Install Sindri PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/sindri-phpunit

      - name: Run PHPUnit against the generated data cache
        if: steps.changes.outputs.files == 'true'
        run: composer sindri-phpunit

  # Dedicated end-to-end job for the RoadRunner runtime. It downloads the real
  # RoadRunner server binary (via spiral/roadrunner-cli) and runs the app under
  # `rr serve`, which the shared PHPUnit workflow cannot do (no hook to fetch a
  # server binary). RoadRunnerEntryTest self-skips if the binary is missing.

  roadrunner-e2e:
    name: RoadRunner E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/phpunit/**'
              - '.github/workflows/ci.yml'
              - '.rr.yaml'
              - 'app/bin/roadrunner-worker.php'
              - 'app/src/**/*.php'
              - 'app/tests/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'

      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Download the RoadRunner server binary
        if: steps.changes.outputs.files == 'true'
        run: ./vendor/bin/rr get-binary

      - name: Install PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/phpunit

      - name: Run the RoadRunner end-to-end test
        if: steps.changes.outputs.files == 'true'
        env:
          RR_BINARY: ${{ github.workspace }}/rr
        run: .github/ci/phpunit/vendor/bin/phpunit -c .github/ci/phpunit/phpunit.xml.dist --filter RoadRunnerEntryTest

  # Dedicated end-to-end job for the FrankenPHP runtime. It downloads the real
  # FrankenPHP server binary and runs the app under its worker mode, which the
  # shared PHPUnit workflow cannot do (no hook to fetch a server binary).
  # FrankenPhpEntryTest self-skips unless FRANKENPHP_BINARY is set.

  frankenphp-e2e:
    name: FrankenPHP E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/phpunit/**'
              - '.github/workflows/ci.yml'
              - 'app/bin/franken-worker.php'
              - 'app/src/**/*.php'
              - 'app/tests/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'

      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Download the FrankenPHP server binary
        if: steps.changes.outputs.files == 'true'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 -o frankenphp https://github.com/dunglas/frankenphp/releases/latest/download/frankenphp-linux-x86_64
          chmod +x frankenphp

      - name: Install PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/phpunit

      - name: Run the FrankenPHP end-to-end test
        if: steps.changes.outputs.files == 'true'
        env:
          FRANKENPHP_BINARY: ${{ github.workspace }}/frankenphp
        run: .github/ci/phpunit/vendor/bin/phpunit -c .github/ci/phpunit/phpunit.xml.dist --filter FrankenPhpEntryTest

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tools.yml@d8c49368481b9270bc9e089b61731dc9b9561be8
    with:
      php-version: '8.4'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      phpunit-extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-mysql, php-sqlite3, php-pgsql, pdo_sqlite, pdo_pgsql, pdo_mysql, openswoole, xdebug'
      psalm-run-script: 'psalm-shepherd-with-stats'
      source-paths: |
        app/src/**/*.php
        app/tests/**/*.php
        composer.json
    secrets: inherit
