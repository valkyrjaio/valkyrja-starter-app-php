name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks. A base-branch change has no
    # activity type of its own; GitHub reports it as `edited` with a `changes.base` payload, and
    # `edited` is not one of the default types, so such a pull request otherwise sits with no checks
    # at all. `edited` also fires for title and description edits, so the tool jobs below additionally
    # require `changes.base` rather than replaying a whole matrix for a reworded description.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  phparkitect:
    name: PHPArkitect
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/ci-phparkitect-php/.github/workflows/_workflow-call.yml@2ec6d1cb187ce2242270c0a3f4572b76de3b8db3
    with:
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/phparkitect/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phparkitect/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.php'
          - 'app/tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpcodesniffer:
    name: PHP Code Sniffer
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/ci-phpcodesniffer-php/.github/workflows/_workflow-call.yml@71d50ad10a9cc2e9ef6b15f1d299bddff72b0027
    with:
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/phpcodesniffer/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpcodesniffer/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.php'
          - 'app/tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpcsfixer:
    name: PHP CS Fixer
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/ci-phpcsfixer-php/.github/workflows/_workflow-call.yml@c787357a29476f7264e5c8a64057bf9d5c1f86f7
    with:
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/phpcsfixer/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpcsfixer/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.php'
          - 'app/tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpstan:
    name: PHPStan
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/ci-phpstan-php/.github/workflows/_workflow-call.yml@766dcf38e0d178e198c5dcbb1ec6bc55f4732599
    with:
      php-version: '8.4'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      paths: |
        ci:
          - '.github/ci/phpstan/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpstan/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.php'
          - 'app/tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpunit:
    name: PHPUnit
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/ci-phpunit-php/.github/workflows/_workflow-call.yml@ca27f8c28932012e8ec6e25c9c949bc410e68b02
    with:
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-mysql, php-sqlite3, php-pgsql, pdo_sqlite, pdo_pgsql, pdo_mysql, openswoole, xdebug'
      paths: |
        ci:
          - '.github/ci/phpunit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpunit/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.php'
          - 'app/tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  # Unlike `phpunit` (which copies the empty *.example.php stubs via the root
  # `setup-example-files` Composer script and tests the app as it compiles without
  # generation), this job runs sindri to generate the real App*Data classes and
  # tests the app as it runs in production. It is an isolated, self-contained job
  # so stubbed and generated results never mingle, and it doubles as a way to
  # exercise sindri itself against a real application before a framework release.
  # It cannot reuse the shared ci-phpunit-php workflow, which hard-codes
  # `composer phpunit` (the stub suite) and has no hook to run the generator.
  sindri-phpunit:
    name: Sindri PHPUnit
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/sindri-phpunit/**'
              - '.github/workflows/ci.yml'
              - 'app/src/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'
          ini-values: zend.assertions=1

      # Installs the framework and sindri (root require-dev) and, via the root
      # `post-install-cmd` hook, copies the *.example.php stubs into place. The
      # generation step below then overwrites those stubs with the real classes.
      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Generate the data cache with sindri
        if: steps.changes.outputs.files == 'true'
        run: composer sindri-generate

      - name: Install Sindri PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/sindri-phpunit

      - name: Run PHPUnit against the generated data cache
        if: steps.changes.outputs.files == 'true'
        run: composer sindri-phpunit

  # Dedicated end-to-end job for the RoadRunner runtime. It downloads the real
  # RoadRunner server binary (via spiral/roadrunner-cli) and runs the app under
  # `rr serve`, which the shared PHPUnit workflow cannot do (no hook to fetch a
  # server binary). RoadRunnerEntryTest self-skips if the binary is missing.
  roadrunner-e2e:
    name: RoadRunner E2E
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/phpunit/**'
              - '.github/workflows/ci.yml'
              - '.rr.yaml'
              - 'app/bin/roadrunner-worker.php'
              - 'app/src/**/*.php'
              - 'app/tests/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'

      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Download the RoadRunner server binary
        if: steps.changes.outputs.files == 'true'
        run: ./vendor/bin/rr get-binary

      - name: Install PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/phpunit

      - name: Run the RoadRunner end-to-end test
        if: steps.changes.outputs.files == 'true'
        env:
          RR_BINARY: ${{ github.workspace }}/rr
        run: .github/ci/phpunit/vendor/bin/phpunit -c .github/ci/phpunit/phpunit.xml.dist --filter RoadRunnerEntryTest

  # Dedicated end-to-end job for the FrankenPHP runtime. It downloads the real
  # FrankenPHP server binary and runs the app under its worker mode, which the
  # shared PHPUnit workflow cannot do (no hook to fetch a server binary).
  # FrankenPhpEntryTest self-skips unless FRANKENPHP_BINARY is set.
  frankenphp-e2e:
    name: FrankenPHP E2E
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/phpunit/**'
              - '.github/workflows/ci.yml'
              - 'app/bin/franken-worker.php'
              - 'app/src/**/*.php'
              - 'app/tests/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'

      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Download the FrankenPHP server binary
        if: steps.changes.outputs.files == 'true'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 -o frankenphp https://github.com/dunglas/frankenphp/releases/latest/download/frankenphp-linux-x86_64
          chmod +x frankenphp

      - name: Install PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/phpunit

      - name: Run the FrankenPHP end-to-end test
        if: steps.changes.outputs.files == 'true'
        env:
          FRANKENPHP_BINARY: ${{ github.workspace }}/frankenphp
        run: .github/ci/phpunit/vendor/bin/phpunit -c .github/ci/phpunit/phpunit.xml.dist --filter FrankenPhpEntryTest

  psalm:
    name: Psalm
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/ci-psalm-php/.github/workflows/_workflow-call.yml@1f216925b5ff78a88c1728d734cab165071b11c2
    with:
      php-version: '8.4'
      run-script: 'psalm-shepherd-with-stats'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      paths: |
        ci:
          - '.github/ci/psalm/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/psalm/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.php'
          - 'app/tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  rector:
    name: Rector
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/ci-rector-php/.github/workflows/_workflow-call.yml@0dafdcf499d607c2471faef2a2c3ca06507cb97e
    with:
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/rector/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/rector/**'
          - '.github/workflows/ci.yml'
          - 'app/src/**/*.php'
          - 'app/tests/**/*.php'
          - 'composer.json'
    secrets: inherit
