name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # A `branches` filter is deliberately absent. The filter matches the base branch, and a stacked
    # pull request bases on its parent's branch, so a filter of `master` and `*.x` gives that pull
    # request no gate until the parent merges. Every pull request runs the gate, whatever it targets.

    # `edited` is deliberately absent. It fires for a title or description edit, and this workflow
    # checks file content, which an edit cannot change. Running it on an edit would cost the full
    # tool suite for a typo. Guarding the jobs on `github.event.changes` instead does not work and
    # is not safe: a caller job skipped by `if:` never produces the `<job> / <job>` context the
    # required status checks wait for, so the pull request blocks; and a guard inside the job would
    # report success without running the tools, so an edit on a red pull request would turn it
    # green. Pull request metadata is checked by `pr.yml`, which does subscribe to `edited`.
    types: [ opened, synchronize, reopened ]

permissions:
  pull-requests: write
  contents: read

jobs:


  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@be1785990063fe1cd15634ab349a680aceebb627
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  markdown-check:
    name: Markdown Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_markdown-check.yml@be1785990063fe1cd15634ab349a680aceebb627
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  sindri-phpunit:
    name: Sindri PHPUnit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/sindri-phpunit/**'
              - '.github/workflows/ci.yml'
              - 'app/src/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'
          ini-values: zend.assertions=1

      # Installs the framework and sindri (root require-dev) and, via the root
      # `post-install-cmd` hook, copies the *.example.php stubs into place. The
      # generation step below then overwrites those stubs with the real classes.
      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Generate the data cache with sindri
        if: steps.changes.outputs.files == 'true'
        run: composer sindri-generate

      - name: Install Sindri PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/sindri-phpunit

      - name: Run PHPUnit against the generated data cache
        if: steps.changes.outputs.files == 'true'
        run: composer sindri-phpunit

  # Dedicated end-to-end job for the RoadRunner runtime. It downloads the real
  # RoadRunner server binary (via spiral/roadrunner-cli) and runs the app under
  # `rr serve`, which the shared PHPUnit workflow cannot do (no hook to fetch a
  # server binary). RoadRunnerEntryTest self-skips if the binary is missing.

  roadrunner-e2e:
    name: RoadRunner E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/phpunit/**'
              - '.github/workflows/ci.yml'
              - '.rr.yaml'
              - 'app/bin/roadrunner-worker.php'
              - 'app/src/**/*.php'
              - 'app/tests/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'

      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Download the RoadRunner server binary
        if: steps.changes.outputs.files == 'true'
        run: ./vendor/bin/rr get-binary

      - name: Install PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/phpunit

      - name: Run the RoadRunner end-to-end test
        if: steps.changes.outputs.files == 'true'
        env:
          RR_BINARY: ${{ github.workspace }}/rr
        run: .github/ci/phpunit/vendor/bin/phpunit -c .github/ci/phpunit/phpunit.xml.dist --filter RoadRunnerEntryTest

  # Dedicated end-to-end job for the FrankenPHP runtime. It downloads the real
  # FrankenPHP server binary and runs the app under its worker mode, which the
  # shared PHPUnit workflow cannot do (no hook to fetch a server binary).
  # FrankenPhpEntryTest self-skips unless FRANKENPHP_BINARY is set.

  frankenphp-e2e:
    name: FrankenPHP E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            files:
              - '.github/ci/phpunit/**'
              - '.github/workflows/ci.yml'
              - 'app/bin/franken-worker.php'
              - 'app/src/**/*.php'
              - 'app/tests/**/*.php'
              - 'composer.json'

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-sqlite3, pdo_sqlite'

      - name: Install root Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Download the FrankenPHP server binary
        if: steps.changes.outputs.files == 'true'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 -o frankenphp https://github.com/dunglas/frankenphp/releases/latest/download/frankenphp-linux-x86_64
          chmod +x frankenphp

      - name: Install PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: .github/ci/phpunit

      - name: Run the FrankenPHP end-to-end test
        if: steps.changes.outputs.files == 'true'
        env:
          FRANKENPHP_BINARY: ${{ github.workspace }}/frankenphp
        run: .github/ci/phpunit/vendor/bin/phpunit -c .github/ci/phpunit/phpunit.xml.dist --filter FrankenPhpEntryTest

  # PHP CS Fixer holds every PHP file to the copyright header, and it reads only PHP. A file of any
  # other type has no mechanism of its own for that reason. This job is closed by default instead:
  # it requires the header in every tracked file that `EXCLUDED` does not match, so a file of a type
  # no tool reads cannot pass in silence. `.github/ci/copyright-header/config` holds that list.
  # The job stands outside the `source-paths` filter that the `tools` job derives, because a
  # filter that misses a path skips the job, and a skipped job reads the same as a clean run.
  copyright-header-check:
    name: Copyright Header Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_copyright-header-check.yml@be1785990063fe1cd15634ab349a680aceebb627
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tools.yml@be1785990063fe1cd15634ab349a680aceebb627
    with:
      php-version: '8.4'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      phpunit-extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-mysql, php-sqlite3, php-pgsql, pdo_sqlite, pdo_pgsql, pdo_mysql, openswoole, xdebug'
      psalm-run-script: 'psalm-shepherd-with-stats'
      # The bin and public entry points are sources too. Without them an edit to an entry
      # point reaches no tool and its header goes unchecked, which is the gap that let
      # `app/bin/cli` carry the wrong package identifier.
      source-paths: |
        app/src/**/*.php
        app/tests/**/*.php
        app/bin/**
        app/public/**
        composer.json
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
